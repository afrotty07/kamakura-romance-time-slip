<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#34251f"><title>鎌倉幕府・ときめきタイムスリップ！</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app" class="app-shell">
<section id="title-screen" class="screen title-screen"><div class="title-card"><p class="eyebrow">KAMAKURA ROMANCE CHRONICLE</p><h1>鎌倉幕府・<br>ときめきタイムスリップ！</h1><p class="subtitle">〜源氏三代と恋の御恩と奉公〜</p><p class="intro">スマホを握ったまま、気づけば鎌倉時代。<br>あなたの言葉が、歴史と恋を少しだけ変えていく。</p><div class="button-stack"><button class="primary" data-action="routes">はじめから <small>｜ルート選択</small></button><button data-action="load">つづきから</button><button data-action="gallery">エンディング一覧</button></div><p class="save-hint">選択で物語が進みます。いつでもセーブできます。</p></div></section>
<section id="route-screen" class="screen hidden"><header class="page-heading"><p class="eyebrow">CHOOSE YOUR DESTINY</p><h2>誰と鎌倉を歩きますか？</h2><button class="text-button" data-action="title">← タイトルへ</button></header><div id="route-cards" class="route-grid"></div></section>
<section id="game-screen" class="screen game-screen hidden"><div class="game-top"><button class="icon-button" data-action="title" aria-label="タイトルへ">⌂</button><div class="affection"><div class="affection-label"><span>ときめき度</span><strong id="affection-value">30%</strong></div><div class="meter"><span id="affection-fill"></span></div></div><div class="top-actions"><button data-action="save">保存</button><button data-action="load">読込</button></div></div><div class="scene-meta"><span id="chapter-label"></span><span id="scene-count"></span></div><div class="stage" id="stage"><img id="character-image" class="character" alt=""><div id="reaction" class="reaction hidden"></div></div><div class="dialogue-area"><div class="choices" id="choices"></div><button id="advance" class="dialogue-box" aria-label="次へ"><span id="speaker" class="speaker"></span><span id="dialogue-text"></span><span class="tap-hint">▼</span></button></div></section>
<section id="ending-screen" class="screen ending-screen hidden"><div class="ending-card"><p class="eyebrow">YOUR KAMAKURA STORY</p><div id="ending-mark" class="ending-mark">✦</div><p id="ending-kind" class="ending-kind"></p><h2 id="ending-title"></h2><p id="ending-summary" class="ending-summary"></p><div class="ending-actions"><button class="primary" data-action="routes">別の人と出会う</button><button data-action="gallery">エンディング一覧</button><button data-action="title">タイトルへ</button></div></div></section>
<section id="gallery-screen" class="screen hidden"><header class="page-heading"><p class="eyebrow">MEMORIES</p><h2>エンディング一覧</h2><p id="gallery-count" class="gallery-count"></p><button class="text-button" data-action="title">← タイトルへ</button></header><div id="gallery-list" class="gallery-grid"></div></section>
</main><dialog id="slot-dialog" class="slot-dialog"><div class="dialog-head"><div><p class="eyebrow">SAVE & LOAD</p><h2 id="slot-title">セーブ</h2></div><button class="icon-button" data-action="close-dialog" aria-label="閉じる">×</button></div><div id="slot-list" class="slot-list"></div></dialog><div id="toast" class="toast" role="status"></div><script src="scenarios.js"></script><script src="game.js"></script></body></html>
